<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Runner</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: #55b9ed;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* ================= MENU ================= */

#menu {
    position: fixed;
    z-index: 20;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    width: min(920px, 94vw);
    max-height: 94vh;
    overflow-y: auto;

    padding: 24px;

    color: white;
    background: rgba(15, 23, 42, 0.97);

    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);

    text-align: center;
}

#menu h1 {
    margin: 0;
    font-size: 30px;
}

.subtitle {
    margin: 7px 0 18px;
    color: #cbd5e1;
}

.section-title {
    margin: 14px 0 8px;
    font-size: 18px;
    font-weight: bold;
}

/* ================= CHARACTERS ================= */

.characters {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;

    max-height: 250px;
    overflow-y: auto;

    padding: 5px;
}

.character {
    min-height: 72px;

    border: 2px solid #475569;
    border-radius: 10px;

    background: #1e293b;
    color: white;

    cursor: pointer;

    font-weight: bold;
    font-size: 13px;

    transition: .15s;
}

.character:hover {
    transform: translateY(-2px);
    border-color: #60a5fa;
}

.character.selected {
    background: #2563eb;
    border-color: #93c5fd;
}

.character .emoji {
    display: block;
    font-size: 29px;
    line-height: 36px;
}

.character img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    display: block;
    margin: 0 auto 3px;
}

/* ================= OPTIONS ================= */

.options {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
}

.option {
    border: 2px solid #475569;
    border-radius: 9px;

    padding: 9px 13px;

    background: #1e293b;
    color: white;

    cursor: pointer;
    font-weight: bold;

    transition: .15s;
}

.option:hover {
    border-color: #60a5fa;
}

.option.selected {
    background: #2563eb;
    border-color: #93c5fd;
}

/* ================= START ================= */

#startButton {
    margin-top: 20px;

    padding: 13px 48px;

    border: none;
    border-radius: 9px;

    background: #22c55e;
    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

#startButton:hover {
    background: #16a34a;
}

.controls {
    margin-top: 12px;
    color: #94a3b8;
    font-size: 12px;
}

/* ================= HUD ================= */

#hud {
    position: fixed;
    z-index: 10;

    top: 12px;
    left: 20px;

    color: #111827;

    font-size: 21px;
    font-weight: bold;

    line-height: 1.35;

    text-shadow:
        1px 1px 0 white,
        -1px -1px 0 white;
}

#modeText {
    font-size: 14px;
}

#boostBar {
    width: 170px;
    height: 12px;

    margin-top: 5px;

    border: 2px solid #111827;
    border-radius: 8px;

    background: rgba(255,255,255,.6);

    overflow: hidden;
}

#boostFill {
    width: 100%;
    height: 100%;
    background: #f59e0b;
}

/* ================= PAUSE ================= */

#pauseScreen {
    position: fixed;
    z-index: 30;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.35);

    color: white;
    font-size: 55px;
    font-weight: bold;
}

/* ================= GAME OVER ================= */

#gameOver {
    position: fixed;
    z-index: 40;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.5);
}

.gameOverBox {
    width: min(400px, 90vw);

    padding: 30px;

    background: #0f172a;
    color: white;

    border-radius: 18px;

    text-align: center;
}

.gameOverBox h2 {
    margin-top: 0;
    font-size: 34px;
}

.gameOverBox button {
    margin: 7px;
    padding: 11px 22px;

    border: none;
    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;
}

#restartButton {
    background: #22c55e;
    color: white;
}

#menuButton {
    background: #334155;
    color: white;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    #menu {
        padding: 14px;
    }

    #menu h1 {
        font-size: 24px;
    }

    .characters {
        grid-template-columns: repeat(3, 1fr);
        max-height: 210px;
    }

    .character {
        font-size: 11px;
    }

    .option {
        font-size: 11px;
        padding: 8px;
    }

    #hud {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- ================= HUD ================= -->

<div id="hud">
    SCORE: <span id="score">0</span><br>
    HIGH: <span id="highScore">1000</span><br>
    COINS: <span id="coinScore">0</span><br>
    <span id="hearts">❤️ ❤️ ❤️</span><br>
    <span id="modeText">NORMAL</span>

    <div id="boostBar">
        <div id="boostFill"></div>
    </div>
</div>

<!-- ================= MENU ================= -->

<div id="menu">

    <h1>🏃 ANIMAL RUNNER</h1>

    <div class="subtitle">
        Choose your character!
    </div>

    <div class="section-title">
        🦸 Character
    </div>

    <div class="characters" id="characterList"></div>

    <div class="section-title">
        🌞 Time
    </div>

    <div class="options">

        <button class="option selected" data-time="day">
            🌞 DAY
        </button>

        <button class="option" data-time="night">
            🌙 NIGHT
        </button>

    </div>

    <div class="section-title">
        🏆 Level
    </div>

    <div class="options">

        <button class="option selected" data-level="easy">
            🟢 EASY
        </button>

        <button class="option" data-level="hard">
            🔴 HARD
        </button>

        <button class="option" data-level="endless">
            ♾️ ENDLESS
        </button>

    </div>

    <div class="section-title">
        🏃 Parkour Mode
    </div>

    <div class="options">

        <button class="option" data-mode="parkourEasy">
            🟢 PARKOUR EASY
        </button>

        <button class="option" data-mode="parkourHard">
            🔴 PARKOUR HARD
        </button>

        <button class="option" data-mode="parkourExtreme">
            💀 PARKOUR EXTREME
        </button>

        <button class="option" data-mode="lava">
            🌋 LAVA PARKOUR
        </button>

    </div>

    <button id="startButton">
        ▶ START GAME
    </button>

    <div class="controls">
        Computer: SPACE / ↑ = Jump &nbsp; | &nbsp;
        ↓ = Duck &nbsp; | &nbsp;
        P = Pause
    </div>

</div>

<!-- ================= PAUSE ================= -->

<div id="pauseScreen">
    PAUSED
</div>

<!-- ================= GAME OVER ================= -->

<div id="gameOver">

    <div class="gameOverBox">

        <h2>GAME OVER</h2>

        <p>
            Score:
            <b id="finalScore">0</b>
        </p>

        <p>
            Coins:
            <b id="finalCoins">0</b>
        </p>

        <p>
            Character:
            <b id="finalCharacter">Dino</b>
        </p>

        <button id="restartButton">
            🔄 PLAY AGAIN
        </button>

        <button id="menuButton">
            🏠 MENU
        </button>

    </div>

</div>

<script>

/* =========================================================
   CHARACTERS
========================================================= */

const characters = [

    {
        name: "Dino",
        emoji: "🦖",
        jump: -19
    },

    {
        name: "VOVA",
        emoji: "😎",
        jump: -19
    },

    {
        name: "Goat",
        emoji: "🐐",
        jump: -19
    },

    {
        name: "Rabbit",
        emoji: "🐰",
        jump: -19
    },

    {
        name: "Fox",
        emoji: "🦊",
        jump: -19
    },

    {
        name: "Cat",
        emoji: "🐱",
        jump: -19
    },

    {
        name: "Dog",
        emoji: "🐶",
        jump: -19
    },

    {
        name: "Panda",
        emoji: "🐼",
        jump: -19
    },

    {
        name: "Sonic",
        emoji: "💙",
        image: "https://pngimg.com/d/sonic_hedgehog_PNG48.png",
        jump: -21
    },

    {
        name: "Pikachu",
        emoji: "⚡",
        image: "https://pngimg.com/d/pikachu_PNG18.png",
        jump: -20
    },

    {
        name: "Mario",
        emoji: "🍄",
        image: "https://pngimg.com/d/mario_PNG129.png",
        jump: -19
    },

    {
        name: "Mickey Mouse",
        emoji: "🐭",
        image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mickey-Mouse.png",
        jump: -19
    },

    {
        name: "SpongeBob",
        emoji: "🧽",
        image: "https://pngimg.com/d/spongebob_PNG2.png",
        jump: -19
    },

    {
        name: "Patrick",
        emoji: "⭐",
        image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Patrick_Star_character.png",
        jump: -18
    },

    {
        name: "Homer Simpson",
        emoji: "🍩",
        image: "https://pngimg.com/d/simpsons_PNG3.png",
        jump: -18
    }

];


/* =========================================================
   DOM
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const gameOver = document.getElementById("gameOver");
const pauseScreen = document.getElementById("pauseScreen");

const scoreElement = document.getElementById("score");
const highScoreElement = document.getElementById("highScore");
const coinScoreElement = document.getElementById("coinScore");
const heartsElement = document.getElementById("hearts");
const modeTextElement = document.getElementById("modeText");
const boostFill = document.getElementById("boostFill");

const characterList = document.getElementById("characterList");

const finalScore = document.getElementById("finalScore");
const finalCoins = document.getElementById("finalCoins");
const finalCharacter = document.getElementById("finalCharacter");


/* =========================================================
   CANVAS SIZE
========================================================= */

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================================================
   SETTINGS
========================================================= */

let currentCharacter = characters[0];

let selectedTime = "day";
let selectedLevel = "easy";
let selectedMode = "normal";


/* =========================================================
   CREATE CHARACTER MENU
========================================================= */

characters.forEach((character, index) => {

    const button = document.createElement("button");

    button.className = "character";

    if(index === 0) {
        button.classList.add("selected");
    }

    if(character.image) {

        const img = document.createElement("img");

        img.src = character.image;
        img.alt = character.name;

        img.onerror = function() {

            this.style.display = "none";

            const emoji = document.createElement("span");

            emoji.className = "emoji";
            emoji.textContent = character.emoji;

            button.insertBefore(emoji, button.firstChild);

        };

        button.appendChild(img);

    } else {

        const emoji = document.createElement("span");

        emoji.className = "emoji";
        emoji.textContent = character.emoji;

        button.appendChild(emoji);

    }

    const name = document.createElement("span");

    name.textContent = character.name;

    button.appendChild(name);

    button.addEventListener("click", () => {

        document
            .querySelectorAll(".character")
            .forEach(b => b.classList.remove("selected"));

        button.classList.add("selected");

        currentCharacter = character;

    });

    characterList.appendChild(button);

});


/* =========================================================
   OPTIONS
========================================================= */

document.querySelectorAll("[data-time]").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll("[data-time]")
            .forEach(b => b.classList.remove("selected"));

        button.classList.add("selected");

        selectedTime = button.dataset.time;

    });

});


document.querySelectorAll("[data-level]").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll("[data-level]")
            .forEach(b => b.classList.remove("selected"));

        button.classList.add("selected");

        selectedLevel = button.dataset.level;

    });

});


document.querySelectorAll("[data-mode]").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll("[data-mode]")
            .forEach(b => b.classList.remove("selected"));

        button.classList.add("selected");

        selectedMode = button.dataset.mode;

    });

});


/* =========================================================
   GAME VARIABLES
========================================================= */

let gameRunning = false;
let paused = false;

let score = 0;
let coins = 0;
let lives = 3;

let highScore =
    Number(localStorage.getItem("animalRunnerHighScore")) || 1000;

let gameSpeed = 7;

let gravity = 0.85;

let groundY = 0;

let spawnTimer = 0;
let coinTimer = 0;
let powerTimer = 0;

let obstacles = [];
let coinObjects = [];
let powerups = [];
let particles = [];

let boost = 100;

let boostActive = false;
let boostTime = 0;

let shield = false;

let animationId = 0;

let lastTime = 0;

let distance = 0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: 120,

    y: 0,

    width: 62,

    height: 72,

    velocityY: 0,

    jumping: false,

    ducking: false,

    invincible: 0,

    draw() {

        let drawX = this.x + this.width / 2;

        let drawBottom = this.y + this.height;

        let image = currentCharacter._image;

        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";

        if(currentCharacter.image) {

            if(!image) {

                image = new Image();

                image.crossOrigin = "anonymous";

                image.src = currentCharacter.image;

                currentCharacter._image = image;

            }

            if(image.complete && image.naturalWidth > 0) {

                const maxWidth = 82;
                const maxHeight = 100;

                const scale = Math.min(
                    maxWidth / image.naturalWidth,
                    maxHeight / image.naturalHeight
                );

                const width =
                    image.naturalWidth * scale;

                const height =
                    image.naturalHeight * scale;

                ctx.drawImage(
                    image,
                    drawX - width / 2,
                    drawBottom - height,
                    width,
                    height
                );

            } else {

                ctx.font = "65px Arial";

                ctx.fillText(
                    currentCharacter.emoji,
                    drawX,
                    drawBottom
                );

            }

        } else {

            ctx.font = "65px Arial";

            ctx.fillText(
                currentCharacter.emoji,
                drawX,
                drawBottom
            );

        }

        /* shield */

        if(shield) {

            ctx.beginPath();

            ctx.arc(
                drawX,
                this.y + this.height / 2,
                48,
                0,
                Math.PI * 2
            );

            ctx.strokeStyle = "#60a5fa";
            ctx.lineWidth = 5;

            ctx.stroke();

        }

        /* boost */

        if(boostActive) {

            ctx.beginPath();

            ctx.arc(
                drawX,
                this.y + this.height / 2,
                53,
                0,
                Math.PI * 2
            );

            ctx.strokeStyle = "#f59e0b";
            ctx.lineWidth = 4;

            ctx.stroke();

        }

    }

};


/* =========================================================
   INPUT
========================================================= */

function jump() {

    if(!gameRunning || paused) {
        return;
    }

    if(!player.jumping) {

        player.velocityY =
            currentCharacter.jump;

        player.jumping = true;

    }

}

function activateBoost() {

    if(!gameRunning || paused) {
        return;
    }

    if(boost > 20 && !boostActive) {

        boostActive = true;

        boostTime = 220;

    }

}

document.addEventListener("keydown", event => {

    if(
        event.code === "Space" ||
        event.code === "ArrowUp"
    ) {

        event.preventDefault();

        jump();

    }

    if(event.code === "ArrowDown") {

        player.ducking = true;

    }

    if(event.code === "KeyP") {

        togglePause();

    }

    if(event.code === "ShiftLeft" ||
       event.code === "ShiftRight") {

        activateBoost();

    }

});


document.addEventListener("keyup", event => {

    if(event.code === "ArrowDown") {

        player.ducking = false;

    }

});


/* =========================================================
   TOUCH
========================================================= */

canvas.addEventListener("touchstart", event => {

    event.preventDefault();

    jump();

}, { passive: false });


canvas.addEventListener("mousedown", event => {

    if(gameRunning) {
        jump();
    }

});


/* =========================================================
   MODE SETTINGS
========================================================= */

function applyModeSettings() {

    if(selectedMode === "parkourEasy") {

        gameSpeed = 8;

    } else if(selectedMode === "parkourHard") {

        gameSpeed = 10;

    } else if(selectedMode === "parkourExtreme") {

        gameSpeed = 12;

    } else if(selectedMode === "lava") {

        gameSpeed = 9;

    } else {

        if(selectedLevel === "easy") {
            gameSpeed = 7;
        }

        if(selectedLevel === "hard") {
            gameSpeed = 10;
        }

        if(selectedLevel === "endless") {
            gameSpeed = 8;
        }

    }

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    cancelAnimationFrame(animationId);

    gameRunning = true;
    paused = false;

    menu.style.display = "none";
    gameOver.style.display = "none";
    pauseScreen.style.display = "none";

    score = 0;
    coins = 0;
    lives = 3;

    boost = 100;
    boostActive = false;
    boostTime = 0;

    shield = false;

    distance = 0;

    obstacles = [];
    coinObjects = [];
    powerups = [];
    particles = [];

    spawnTimer = 80;
    coinTimer = 120;
    powerTimer = 500;

    player.velocityY = 0;
    player.jumping = false;
    player.ducking = false;
    player.invincible = 0;

    groundY = canvas.height - 85;

    player.y =
        groundY - player.height;

    applyModeSettings();

    updateHUD();

    modeTextElement.textContent =
        getModeName();

    lastTime = performance.now();

    animationId =
        requestAnimationFrame(gameLoop);

}


/* =========================================================
   MODE NAME
========================================================= */

function getModeName() {

    if(selectedMode === "parkourEasy") {
        return "PARKOUR EASY";
    }

    if(selectedMode === "parkourHard") {
        return "PARKOUR HARD";
    }

    if(selectedMode === "parkourExtreme") {
        return "PARKOUR EXTREME";
    }

    if(selectedMode === "lava") {
        return "🌋 LAVA PARKOUR";
    }

    return selectedLevel.toUpperCase();

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if(!gameRunning) {
        return;
    }

    paused = !paused;

    pauseScreen.style.display =
        paused ? "flex" : "none";

}


/* =========================================================
   SPAWN OBSTACLE
========================================================= */

function spawnObstacle() {

    let type = "rock";

    const random = Math.random();

    if(random < 0.25) {
        type = "cactus";
    }

    if(random < 0.12) {
        type = "box";
    }

    if(
        selectedMode === "parkourHard" ||
        selectedMode === "parkourExtreme"
    ) {

        if(Math.random() < 0.35) {
            type = "spike";
        }

    }

    if(selectedMode === "lava") {

        type = "lavaRock";

    }

    let width = 45;
    let height = 45;

    if(type === "cactus") {

        width = 35;
        height = 65;

    }

    if(type === "box") {

        width = 55;
        height = 55;

    }

    if(type === "spike") {

        width = 55;
        height = 45;

    }

    if(type === "lavaRock") {

        width = 50;
        height = 50;

    }

    obstacles.push({

        x: canvas.width + 40,

        y: groundY - height,

        width: width,

        height: height,

        type: type

    });

}


/* =========================================================
   SPAWN COIN
========================================================= */

function spawnCoin() {

    const height =
        groundY -
        (80 + Math.random() * 170);

    coinObjects.push({

        x: canvas.width + 30,

        y: Math.max(90, height),

        radius: 12,

        rotation: 0

    });

}


/* =========================================================
   SPAWN POWERUP
========================================================= */

function spawnPowerup() {

    const types = [
        "shield",
        "boost",
        "heart"
    ];

    const type =
        types[Math.floor(Math.random() * types.length)];

    powerups.push({

        x: canvas.width + 30,

        y: groundY - 120 - Math.random() * 100,

        size: 25,

        type: type

    });

}


/* =========================================================
   COLLISION
========================================================= */

function collision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );

}


/* =========================================================
   PLAYER HITBOX
========================================================= */

function getPlayerHitbox() {

    if(player.ducking) {

        return {

            x: player.x + 5,

            y: player.y + 25,

            width: player.width - 10,

            height: player.height - 25

        };

    }

    return {

        x: player.x + 8,

        y: player.y + 8,

        width: player.width - 16,

        height: player.height - 10

    };

}


/* =========================================================
   DAMAGE
========================================================= */

function damagePlayer() {

    if(player.invincible > 0) {
        return;
    }

    if(shield) {

        shield = false;

        player.invincible = 100;

        createParticles(
            player.x + player.width / 2,
            player.y + player.height / 2,
            12
        );

        return;

    }

    lives--;

    player.invincible = 120;

    createParticles(
        player.x + player.width / 2,
        player.y + player.height / 2,
        15
    );

    updateHUD();

    if(lives <= 0) {

        endGame();

    }

}


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer() {

    if(player.invincible > 0) {
        player.invincible--;
    }

    player.velocityY += gravity;

    player.y += player.velocityY;

    if(player.y >= groundY - player.height) {

        player.y =
            groundY - player.height;

        player.velocityY = 0;

        player.jumping = false;

    }

}


/* =========================================================
   UPDATE OBSTACLES
========================================================= */

function updateObstacles() {

    const actualSpeed =
        boostActive
            ? gameSpeed * 1.8
            : gameSpeed;

    for(let i = obstacles.length - 1; i >= 0; i--) {

        const obstacle = obstacles[i];

        obstacle.x -= actualSpeed;

        if(
            collision(
                getPlayerHitbox(),
                obstacle
            )
        ) {

            damagePlayer();

            obstacles.splice(i, 1);

            continue;

        }

        if(obstacle.x + obstacle.width < -50) {

            obstacles.splice(i, 1);

        }

    }

}


/* =========================================================
   UPDATE COINS
========================================================= */

function updateCoins() {

    const actualSpeed =
        boostActive
            ? gameSpeed * 1.8
            : gameSpeed;

    for(let i = coinObjects.length - 1; i >= 0; i--) {

        const coin = coinObjects[i];

        coin.x -= actualSpeed;

        coin.rotation += .1;

        const dx =
            player.x + player.width / 2 -
            coin.x;

        const dy =
            player.y + player.height / 2 -
            coin.y;

        const distanceToCoin =
            Math.sqrt(dx * dx + dy * dy);

        if(distanceToCoin < 40) {

            coins++;

            score += 25;

            createParticles(
                coin.x,
                coin.y,
                7
            );

            coinObjects.splice(i, 1);

            continue;

        }

        if(coin.x < -30) {

            coinObjects.splice(i, 1);

        }

    }

}


/* =========================================================
   UPDATE POWERUPS
========================================================= */

function updatePowerups() {

    const actualSpeed =
        boostActive
            ? gameSpeed * 1.8
            : gameSpeed;

    for(let i = powerups.length - 1; i >= 0; i--) {

        const power =
            powerups[i];

        power.x -= actualSpeed;

        const box = {

            x: power.x - power.size / 2,

            y: power.y - power.size / 2,

            width: power.size,

            height: power.size

        };

        if(
            collision(
                getPlayerHitbox(),
                box
            )
        ) {

            if(power.type === "shield") {

                shield = true;

            }

            if(power.type === "boost") {

                boost = Math.min(
                    100,
                    boost + 50
                );

            }

            if(power.type === "heart") {

                lives =
                    Math.min(3, lives + 1);

            }

            createParticles(
                power.x,
                power.y,
                10
            );

            powerups.splice(i, 1);

            continue;

        }

        if(power.x < -40) {

            powerups.splice(i, 1);

        }

    }

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(x, y, amount) {

    for(let i = 0; i < amount; i++) {

        particles.push({

            x: x,

            y: y,

            velocityX:
                (Math.random() - .5) * 7,

            velocityY:
                (Math.random() - .5) * 7,

            life: 30 + Math.random() * 25,

            size:
                3 + Math.random() * 5

        });

    }

}


function updateParticles() {

    for(let i = particles.length - 1; i >= 0; i--) {

        const particle =
            particles[i];

        particle.x +=
            particle.velocityX;

        particle.y +=
            particle.velocityY;

        particle.velocityY += .15;

        particle.life--;

        if(particle.life <= 0) {

            particles.splice(i, 1);

        }

    }

}


/* =========================================================
   SPAWN CONTROL
========================================================= */

function updateSpawning() {

    spawnTimer--;

    coinTimer--;

    powerTimer--;

    if(spawnTimer <= 0) {

        spawnObstacle();

        let minimum = 55;

        let maximum = 105;

        if(selectedMode === "parkourHard") {

            minimum = 45;
            maximum = 80;

        }

        if(selectedMode === "parkourExtreme") {

            minimum = 30;
            maximum = 65;

        }

        if(selectedMode === "lava") {

            minimum = 45;
            maximum = 75;

        }

        spawnTimer =
            minimum +
            Math.random() *
            (maximum - minimum);

    }


    if(coinTimer <= 0) {

        spawnCoin();

        coinTimer =
            65 +
            Math.random() * 100;

    }


    if(powerTimer <= 0) {

        spawnPowerup();

        powerTimer =
            500 +
            Math.random() * 700;

    }

}


/* =========================================================
   UPDATE SCORE
========================================================= */

function updateScore() {

    score += 0.08;

    distance += gameSpeed;

    if(selectedLevel === "hard") {

        score += 0.04;

    }

    if(selectedLevel === "endless") {

        score += 0.1;

    }

    if(
        selectedMode === "parkourHard" ||
        selectedMode === "parkourExtreme"
    ) {

        score += 0.08;

    }

    if(boostActive) {

        boost -= .25;

        boostTime--;

        if(boostTime <= 0 || boost <= 0) {

            boostActive = false;

        }

    } else {

        boost += .025;

        if(boost > 100) {
            boost = 100;
        }

    }

}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

    const width = canvas.width;
    const height = canvas.height;

    if(selectedTime === "night") {

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                height
            );

        gradient.addColorStop(
            0,
            "#07142e"
        );

        gradient.addColorStop(
            1,
            "#17355e"
        );

        ctx.fillStyle = gradient;

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        /* moon */

        ctx.fillStyle = "#f8f0a8";

        ctx.beginPath();

        ctx.arc(
            width - 130,
            120,
            55,
            0,
            Math.PI * 2
        );

        ctx.fill();

        /* stars */

        ctx.fillStyle = "white";

        for(let i = 0; i < 50; i++) {

            const x =
                (i * 173) % width;

            const y =
                30 + ((i * 71) % 280);

            ctx.fillRect(
                x,
                y,
                2,
                2
            );

        }

    } else {

        ctx.fillStyle = "#58b9ed";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        /* sun */

        ctx.fillStyle = "#ffe45c";

        ctx.beginPath();

        ctx.arc(
            width - 150,
            120,
            65,
            0,
            Math.PI * 2
        );

        ctx.fill();

        drawClouds();

    }

}


/* =========================================================
   CLOUDS
========================================================= */

function drawClouds() {

    const clouds = [

        [160, 150, 1],

        [430, 230, .8],

        [760, 120, 1.2],

        [1120, 190, .9],

        [1450, 130, 1]

    ];

    ctx.fillStyle =
        "rgba(255,255,255,.75)";

    clouds.forEach(cloud => {

        const x = cloud[0] % canvas.width;
        const y = cloud[1];
        const s = cloud[2];

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            35 * s,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 40 * s,
            y - 15 * s,
            45 * s,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 85 * s,
            y,
            32 * s,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });

}


/* =========================================================
   DRAW GROUND
========================================================= */

function drawGround() {

    groundY =
        canvas.height - 85;

    if(selectedMode === "lava") {

        /* lava */

        ctx.fillStyle = "#5b1b10";

        ctx.fillRect(
            0,
            groundY,
            canvas.width,
            85
        );

        ctx.fillStyle = "#ff5a16";

        ctx.fillRect(
            0,
            groundY,
            canvas.width,
            12
        );

        ctx.fillStyle = "#ffb21a";

        for(let x = -40; x < canvas.width + 40; x += 80) {

            const offset =
                (distance * .7) % 80;

            ctx.beginPath();

            ctx.arc(
                x - offset,
                groundY + 25,
                20,
                0,
                Math.PI
            );

            ctx.fill();

        }

    } else {

        /* road */

        ctx.fillStyle = "#8b451f";

        ctx.fillRect(
            0,
            groundY,
            canvas.width,
            13
        );

        ctx.fillStyle = "#f4cf38";

        ctx.fillRect(
            0,
            groundY + 13,
            canvas.width,
            72
        );

        /* road lines */

        ctx.fillStyle = "rgba(255,255,255,.45)";

        const offset =
            distance % 100;

        for(
            let x = -100 - offset;
            x < canvas.width + 100;
            x += 100
        ) {

            ctx.fillRect(
                x,
                groundY + 48,
                55,
                7
            );

        }

    }

}


/* =========================================================
   DRAW OBSTACLES
========================================================= */

function drawObstacles() {

    obstacles.forEach(obstacle => {

        if(obstacle.type === "cactus") {

            drawCactus(obstacle);

        } else if(obstacle.type === "spike") {

            drawSpike(obstacle);

        } else if(obstacle.type === "box") {

            drawBox(obstacle);

        } else if(obstacle.type === "lavaRock") {

            drawLavaRock(obstacle);

        } else {

            drawRock(obstacle);

        }

    });

}


/* =========================================================
   ROCK
========================================================= */

function drawRock(o) {

    ctx.fillStyle = "#64748b";

    ctx.beginPath();

    ctx.moveTo(
        o.x,
        o.y + o.height
    );

    ctx.lineTo(
        o.x + 8,
        o.y + 12
    );

    ctx.lineTo(
        o.x + o.width * .55,
        o.y
    );

    ctx.lineTo(
        o.x + o.width - 5,
        o.y + 15
    );

    ctx.lineTo(
        o.x + o.width,
        o.y + o.height
    );

    ctx.closePath();

    ctx.fill();

}


/* =========================================================
   CACTUS
========================================================= */

function drawCactus(o) {

    ctx.fillStyle = "#168a45";

    ctx.fillRect(
        o.x + 10,
        o.y,
        18,
        o.height
    );

    ctx.fillRect(
        o.x,
        o.y + 20,
        12,
        15
    );

    ctx.fillRect(
        o.x + 28,
        o.y + 30,
        12,
        15
    );

}


/* =========================================================
   BOX
========================================================= */

function drawBox(o) {

    ctx.fillStyle = "#a65b2e";

    ctx.fillRect(
        o.x,
        o.y,
        o.width,
        o.height
    );

    ctx.strokeStyle = "#63341d";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        o.x,
        o.y,
        o.width,
        o.height
    );

    ctx.beginPath();

    ctx.moveTo(
        o.x,
        o.y
    );

    ctx.lineTo(
        o.x + o.width,
        o.y + o.height
    );

    ctx.moveTo(
        o.x + o.width,
        o.y
    );

    ctx.lineTo(
        o.x,
        o.y + o.height
    );

    ctx.stroke();

}


/* =========================================================
   SPIKE
========================================================= */

function drawSpike(o) {

    ctx.fillStyle = "#334155";

    const count = 3;

    const step =
        o.width / count;

    for(let i = 0; i < count; i++) {

        ctx.beginPath();

        ctx.moveTo(
            o.x + i * step,
            o.y + o.height
        );

        ctx.lineTo(
            o.x + i * step + step / 2,
            o.y
        );

        ctx.lineTo(
            o.x + (i + 1) * step,
            o.y + o.height
        );

        ctx.closePath();

        ctx.fill();

    }

}


/* =========================================================
   LAVA ROCK
========================================================= */

function drawLavaRock(o) {

    ctx.fillStyle = "#29150f";

    ctx.beginPath();

    ctx.arc(
        o.x + o.width / 2,
        o.y + o.height / 2,
        o.width / 2,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle = "#ff5a16";

    ctx.lineWidth = 4;

    ctx.stroke();

}


/* =========================================================
   DRAW COINS
========================================================= */

function drawCoins() {

    coinObjects.forEach(coin => {

        ctx.save();

        ctx.translate(
            coin.x,
            coin.y
        );

        const scale =
            Math.abs(Math.cos(coin.rotation));

        ctx.scale(
            Math.max(.2, scale),
            1
        );

        ctx.fillStyle = "#ffd21c";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            coin.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle = "#b87900";

        ctx.lineWidth = 3;

        ctx.stroke();

        ctx.fillStyle = "#fff4a3";

        ctx.font = "bold 14px Arial";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            "$",
            0,
            1
        );

        ctx.restore();

    });

}


/* =========================================================
   DRAW POWERUPS
========================================================= */

function drawPowerups() {

    powerups.forEach(power => {

        let color = "#60a5fa";
        let symbol = "🛡️";

        if(power.type === "boost") {

            color = "#f59e0b";
            symbol = "⚡";

        }

        if(power.type === "heart") {

            color = "#ef4444";
            symbol = "❤️";

        }

        ctx.beginPath();

        ctx.arc(
            power.x,
            power.y,
            23,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = color;

        ctx.fill();

        ctx.font = "20px Arial";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillStyle = "white";

        ctx.fillText(
            symbol,
            power.x,
            power.y
        );

    });

}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles() {

    particles.forEach(particle => {

        ctx.globalAlpha =
            Math.max(
                0,
                particle.life / 50
            );

        ctx.fillStyle = "#ffffff";

        ctx.beginPath();

        ctx.arc(
            particle.x,
            particle.y,
            particle.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });

    ctx.globalAlpha = 1;

}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    scoreElement.textContent =
        Math.floor(score);

    coinScoreElement.textContent =
        coins;

    highScoreElement.textContent =
        highScore;

    let hearts = "";

    for(let i = 0; i < lives; i++) {

        hearts += "❤️ ";

    }

    heartsElement.textContent =
        hearts.trim();

    boostFill.style.width =
        Math.max(0, Math.min(100, boost)) + "%";

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(timestamp) {

    if(!gameRunning) {
        return;
    }

    animationId =
        requestAnimationFrame(gameLoop);

    if(paused) {
        return;
    }

    const delta =
        Math.min(
            2,
            (timestamp - lastTime) / 16.67
        );

    lastTime = timestamp;

    /* speed increases */

    if(
        selectedLevel === "endless" &&
        Math.floor(score) % 300 === 0
    ) {

        gameSpeed += .001;

    }

    updatePlayer();

    updateSpawning();

    updateObstacles();

    updateCoins();

    updatePowerups();

    updateParticles();

    updateScore();

    /* draw */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();

    drawGround();

    drawCoins();

    drawPowerups();

    drawObstacles();

    drawParticles();

    /* player flashing after hit */

    if(
        player.invincible > 0 &&
        Math.floor(player.invincible / 6) % 2 === 0
    ) {

        ctx.globalAlpha = .35;

    }

    player.draw();

    ctx.globalAlpha = 1;

    updateHUD();

}


/* =========================================================
   END GAME
========================================================= */

function endGame() {

    gameRunning = false;

    cancelAnimationFrame(animationId);

    const final =
        Math.floor(score);

    if(final > highScore) {

        highScore = final;

        localStorage.setItem(
            "animalRunnerHighScore",
            highScore
        );

    }

    finalScore.textContent =
        final;

    finalCoins.textContent =
        coins;

    finalCharacter.textContent =
        currentCharacter.name;

    highScoreElement.textContent =
        highScore;

    gameOver.style.display =
        "flex";

}


/* =========================================================
   SHOW MENU
========================================================= */

function showMenu() {

    gameRunning = false;

    paused = false;

    cancelAnimationFrame(animationId);

    gameOver.style.display =
        "none";

    pauseScreen.style.display =
        "none";

    menu.style.display =
        "block";

}


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("restartButton")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("menuButton")
    .addEventListener(
        "click",
        showMenu
    );


/* =========================================================
   INITIAL DRAW
========================================================= */

function initialDraw() {

    groundY =
        canvas.height - 85;

    drawBackground();

    drawGround();

    player.y =
        groundY - player.height;

    player.draw();

}

initialDraw();

</script>
